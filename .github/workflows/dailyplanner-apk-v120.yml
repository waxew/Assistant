name: DailyPlanner APK v1.2.0

on:
  push:
    branches: [ dailyplanner-v120-final ]
    paths:
      - '.ci/dailyplanner-v120-final2/**'
      - '.github/workflows/dailyplanner-apk-v120.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify v1.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dp120
          cat \
            .ci/dailyplanner-v120-final2/part.00 \
            .ci/dailyplanner-v120-final2/part.01a0 \
            .ci/dailyplanner-v120-final2/part.01a1 \
            .ci/dailyplanner-v120-final2/part.01a20 \
            .ci/dailyplanner-v120-final2/part.01a21 \
            .ci/dailyplanner-v120-final2/part.01b \
            .ci/dailyplanner-v120-final2/part.01c \
            .ci/dailyplanner-v120-final2/part.02 \
            .ci/dailyplanner-v120-final2/part.03 \
            .ci/dailyplanner-v120-final2/part.04 \
            .ci/dailyplanner-v120-final2/part.05 \
            .ci/dailyplanner-v120-final2/part.06 \
            .ci/dailyplanner-v120-final2/part.07 \
            .ci/dailyplanner-v120-final2/part.08 \
            .ci/dailyplanner-v120-final2/part.09_00 \
            .ci/dailyplanner-v120-final2/part.09_01 \
            .ci/dailyplanner-v120-final2/part.09_02 \
            .ci/dailyplanner-v120-final2/part.09_03 \
            .ci/dailyplanner-v120-final2/part.09_04 \
            .ci/dailyplanner-v120-final2/part.09_05 \
            .ci/dailyplanner-v120-final2/part.09_06 \
            .ci/dailyplanner-v120-final2/part.09_07 \
            .ci/dailyplanner-v120-final2/part.09_08 \
            .ci/dailyplanner-v120-final2/part.10_00 \
            .ci/dailyplanner-v120-final2/part.10_01 \
            .ci/dailyplanner-v120-final2/part.10_02 \
            .ci/dailyplanner-v120-final2/part.10_03 \
            .ci/dailyplanner-v120-final2/part.10_04 \
            .ci/dailyplanner-v120-final2/part.10_05 \
            .ci/dailyplanner-v120-final2/part.10_06 \
            .ci/dailyplanner-v120-final2/part.10_07 \
            .ci/dailyplanner-v120-final2/part.10_08 \
            .ci/dailyplanner-v120-final2/part.11_00 \
            .ci/dailyplanner-v120-final2/part.11_01 \
            .ci/dailyplanner-v120-final2/part.11_02 \
            .ci/dailyplanner-v120-final2/part.11_03 \
            .ci/dailyplanner-v120-final2/part.11_04 \
            .ci/dailyplanner-v120-final2/part.11_05 \
            .ci/dailyplanner-v120-final2/part.11_06 > /tmp/source.b64
          base64 --decode --ignore-garbage /tmp/source.b64 > /tmp/AS-DailyPlanner-v1.2.0-source-final.zip
          echo '09e8d2e815b0a9b1601a81de7f62f58e044509d1a57a9f8e278f9a258700dc87  /tmp/AS-DailyPlanner-v1.2.0-source-final.zip' | sha256sum -c -
          unzip -q /tmp/AS-DailyPlanner-v1.2.0-source-final.zip -d /tmp/dp120

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and unsigned release APKs
        working-directory: /tmp/dp120/AS-DailyPlanner
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          DEBUG=/tmp/dp120/AS-DailyPlanner/app/build/outputs/apk/debug/app-debug.apk
          RELEASE=/tmp/dp120/AS-DailyPlanner/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG"
          test -s "$RELEASE"
          unzip -t "$RELEASE"
          sha256sum "$DEBUG" "$RELEASE"
          cp "$DEBUG" AS-DailyPlanner-v1.2.0-debug.apk
          cp "$RELEASE" AS-DailyPlanner-v1.2.0-release-unsigned.apk
          cp /tmp/AS-DailyPlanner-v1.2.0-source-final.zip AS-DailyPlanner-v1.2.0-source-final.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: AS-DailyPlanner-v1.2.0-release-build
          path: |
            AS-DailyPlanner-v1.2.0-debug.apk
            AS-DailyPlanner-v1.2.0-release-unsigned.apk
            AS-DailyPlanner-v1.2.0-source-final.zip
          if-no-files-found: error
