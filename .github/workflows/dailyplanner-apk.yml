name: DailyPlanner APK

on:
  push:
    branches: [ build-daily-planner-apk ]
    paths:
      - 'dailyplanner-build/**'
      - '.github/workflows/dailyplanner-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: dailyplanner-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp dailyplanner-build/app/build/outputs/apk/debug/app-debug.apk AS-DailyPlanner-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-DailyPlanner-v1.0.0
          path: AS-DailyPlanner-v1.0.0.apk
          if-no-files-found: error
