name: DailyPlanner APK v1.1.0

on:
  push:
    branches: [ build-daily-planner-apk ]
    paths:
      - '.ci/dailyplanner-v110/**'
      - '.github/workflows/dailyplanner-apk-v110.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.1.0 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/dailyplanner-v110
          cat .ci/dailyplanner-v110/clean.00 .ci/dailyplanner-v110/clean.01 .ci/dailyplanner-v110/clean.02 .ci/dailyplanner-v110/clean.03 .ci/dailyplanner-v110/clean.04 .ci/dailyplanner-v110/clean.05 .ci/dailyplanner-v110/clean.06 .ci/dailyplanner-v110/clean.07 .ci/dailyplanner-v110/clean.08 .ci/dailyplanner-v110/clean.09a .ci/dailyplanner-v110/source.b64.04a .ci/dailyplanner-v110/clean.10 .ci/dailyplanner-v110/clean.11 > /tmp/source.b64
          base64 --decode --ignore-garbage /tmp/source.b64 > /tmp/AS-DailyPlanner-v1.1.0-source.zip
          echo "6cf644cd31aeac1f6b2a1593785bf1b9e871fe6c55e478b1e0d86b8efd0bdcc2  /tmp/AS-DailyPlanner-v1.1.0-source.zip" | sha256sum -c -
          unzip -t /tmp/AS-DailyPlanner-v1.1.0-source.zip
          unzip -q /tmp/AS-DailyPlanner-v1.1.0-source.zip -d /tmp/dailyplanner-v110
          test -f /tmp/dailyplanner-v110/AS-DailyPlanner/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/dailyplanner-v110/AS-DailyPlanner
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s /tmp/dailyplanner-v110/AS-DailyPlanner/app/build/outputs/apk/debug/app-debug.apk
          file /tmp/dailyplanner-v110/AS-DailyPlanner/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/dailyplanner-v110/AS-DailyPlanner/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp /tmp/dailyplanner-v110/AS-DailyPlanner/app/build/outputs/apk/debug/app-debug.apk AS-DailyPlanner-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-DailyPlanner-v1.1.0
          path: AS-DailyPlanner-v1.1.0.apk
          if-no-files-found: error
