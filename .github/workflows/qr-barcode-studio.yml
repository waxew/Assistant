name: QR Barcode Studio Android

on:
  push:
    branches: [ main ]
    paths:
      - 'android/qr-barcode-studio/**'
      - '.github/workflows/qr-barcode-studio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        run: |
          mkdir -p /tmp/qr-build
          cat android/qr-barcode-studio/source/source.b64.* > /tmp/qr-source.b64
          base64 -d /tmp/qr-source.b64 > /tmp/qr-source.zip
          unzip -q /tmp/qr-source.zip -d /tmp/qr-build
          test -f /tmp/qr-build/qr-barcode-studio/settings.gradle.kts

      - name: Patch scanner package
        run: |
          sed -i 's/com.google.zxing.integration.android.ScanContract/com.journeyapps.barcodescanner.ScanContract/' /tmp/qr-build/qr-barcode-studio/app/src/main/java/com/waxew/qrbarcode/ui/QrBarcodeApp.kt
          sed -i 's/com.google.zxing.integration.android.ScanOptions/com.journeyapps.barcodescanner.ScanOptions/' /tmp/qr-build/qr-barcode-studio/app/src/main/java/com/waxew/qrbarcode/ui/QrBarcodeApp.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: /tmp/qr-build/qr-barcode-studio
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Barcode-Studio-v1.0.0-debug
          path: /tmp/qr-build/qr-barcode-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
