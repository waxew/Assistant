[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-store-builder"
version = "1.0.0"
description = "Multi-tenant Telegram store bot builder"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram==3.30.0",
  "aiohttp==3.12.15",
  "SQLAlchemy[asyncio]==2.0.52",
  "aiosqlite==0.21.0",
  "asyncpg==0.30.0",
  "cryptography==46.0.0",
  "alembic==1.16.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
